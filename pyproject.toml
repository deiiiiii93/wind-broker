[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-broker"
version = "1.0.0"
description = "Machine-wide persistent WindPy session daemon (windd) and drop-in client SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fuxinyao" }]
dependencies = ["pandas>=1.5"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/deiiiiii93/wind-broker"
Issues = "https://github.com/deiiiiii93/wind-broker/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
windd = "wind_broker.daemon:main"
windctl = "wind_broker.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["wind_broker_client"]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
